<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Poster Series | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #eee;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 1.5rem 2rem;
      background-color: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
    }

    .back-btn {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      background: #2a2a2a;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      transition: background 0.3s ease;
    }

    .back-btn:hover {
      background-color: #333;
    }

    .slideshow-container {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .slideshow-card {
      background-color: #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
      padding: 1rem;
      box-shadow: 0 0 30px rgba(255, 100, 50, 0.2);
      position: relative;
      max-width: 720px;
      width: 100%;
    }

    .slide-wrapper {
      position: relative;
      width: 100%;
    }

    .slide {
      opacity: 0;
      position: absolute;
      top: 0;
      left: 0;
      transition: opacity 0.7s ease-in-out;
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .slide.active {
      opacity: 1;
      position: relative;
    }

    .dots {
      margin-top: 1rem;
      text-align: center;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 9999px;
      background-color: rgba(255, 255, 255, 0.4);
      display: inline-block;
      margin: 0 5px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background-color: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      color: #777;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html#portfolio" class="back-btn">← Back to Portfolio</a>
  </header>

  <div class="slideshow-container">
    <div class="slideshow-card">
      <div class="slide-wrapper">
        <img src="19.png" class="slide active" alt="Poster 1">

      </div>
      <div class="dots">
        <!--<span class="dot"></span>-->
      </div>
    </div>
  </div>

  <footer>
    &copy; 2025 Rishi Asnani
  </footer>

  <script>
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');
    let index = 0;

    function showSlide(i) {
      slides.forEach((slide, idx) => {
        slide.classList.toggle('active', idx === i);
        dots[idx].style.opacity = idx === i ? '1' : '0.4';
      });
      index = i;
    }

    setInterval(() => {
      index = (index + 1) % slides.length;
      showSlide(index);
    }, 3000);

    dots.forEach((dot, i) => {
      dot.addEventListener('click', () => showSlide(i));
    });

    showSlide(index);
  </script>

</body>
</html>
